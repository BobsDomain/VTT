# The Telegram bot's GitHub side (bot/github.mjs):
#  • docs/REQUESTS.md is rebuilt whenever a request issue changes (and on the schedule)
#  • backup: while no Cloudflare Worker is set up, it reads the group every 10 minutes and answers
# Set up: docs/TELEGRAM-BOT.md.
name: Telegram bot

on:
  schedule:
    - cron: '*/10 * * * *'
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  workflow_dispatch: # run it now from the Actions tab

permissions:
  contents: write
  issues: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # issue changes only matter for requests
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'feature-request')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read the group and answer
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          REQUESTS_PER_DAY: ${{ vars.REQUESTS_PER_DAY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ]; then echo "No TELEGRAM_TOKEN secret yet: see docs/TELEGRAM-BOT.md"; exit 0; fi
          node bot/github.mjs ${{ github.event_name == 'issues' && '--list' || '' }}
      - name: Save the requests list
        run: |
          if [ -n "$(git status --porcelain docs/REQUESTS.md)" ]; then
            git config user.name "tabletop-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/REQUESTS.md
            git commit -m "Requests list: updated from the Telegram group"
            git pull --rebase && git push
          fi
