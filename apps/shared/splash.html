<!doctype html>
<html><head><meta charset="utf-8"><title>Tabletop</title>
<style>
  html, body { margin:0; height:100%; background:#121212; color:#e7e5e4; font-family:'Segoe UI', system-ui, sans-serif; -webkit-app-region:drag; user-select:none; overflow:hidden; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; border:1px solid #2a2a2a; box-sizing:border-box; border-top:3px solid #e8390e; }
  .d20 { width:72px; height:72px; animation:spin 2.4s cubic-bezier(.5,.1,.5,.9) infinite; filter:drop-shadow(0 0 10px rgba(232,57,14,.35)); }
  @keyframes spin { 0% { transform:rotate(0) scale(1); } 50% { transform:rotate(180deg) scale(.92); } 100% { transform:rotate(360deg) scale(1); } }
  .word { font-weight:800; letter-spacing:.32em; font-size:20px; margin-left:.32em; }
  .word span { color:#e8390e; }
  .app { font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:#a8a29e; margin-top:-8px; }
  #status { font-size:13px; color:#a8a29e; min-height:18px; }
  .bar { width:180px; height:3px; background:#2a2a2a; border-radius:2px; overflow:hidden; }
  .bar i { display:block; width:40%; height:100%; background:#e8390e; border-radius:2px; animation:slide 1.3s ease-in-out infinite; }
  @keyframes slide { 0% { transform:translateX(-100%); } 100% { transform:translateX(250%); } }
  .ver { position:fixed; bottom:8px; right:10px; font-size:11px; color:#57534e; }
</style></head>
<body>
  <svg class="d20" viewBox="0 0 100 100" aria-hidden="true">
    <polygon points="50,4 90,27 90,73 50,96 10,73 10,27" fill="#1c1917" stroke="#e8390e" stroke-width="3" stroke-linejoin="round"/>
    <g fill="none" stroke="#e8390e" stroke-width="2" stroke-linejoin="round" opacity=".75"><polygon points="50,28 72,64 28,64"/><path d="M50,4 50,28 M90,27 50,28 M10,27 50,28 M90,27 72,64 M90,73 72,64 M10,27 28,64 M10,73 28,64 M50,96 72,64 M50,96 28,64"/></g>
    <text x="50" y="57" text-anchor="middle" font-size="18" font-weight="800" fill="#e7e5e4" font-family="Segoe UI, sans-serif">20</text>
  </svg>
  <div class="word">TABLE<span>TOP</span></div>
  <div class="app" id="app"></div>
  <div class="bar"><i></i></div>
  <div id="status">Starting…</div>
  <div class="ver" id="ver"></div>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById('app').textContent = q.get('app') || '';
    document.getElementById('ver').textContent = q.get('v') ? 'v' + q.get('v') : '';
    document.getElementById('status').textContent = q.get('status') || 'Starting…';
    window.setStatus = (t) => { document.getElementById('status').textContent = t; };
  </script>
</body></html>
